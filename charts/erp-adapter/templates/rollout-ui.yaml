{{- if ne .Values.ui.blueGreen.phase "disabled" }}
{{- $deployment := include "erp.deployment" (dict "root" . "component" "ui" "port" 80) | fromYaml }}
{{- $pod := $deployment.spec.template }}
{{- $_ := set $pod.metadata.labels "app" "metasfresh-ui-bluegreen" }}
{{- range $constraint := $pod.spec.topologySpreadConstraints }}
{{- $_ := set $constraint.labelSelector.matchLabels "app" "metasfresh-ui-bluegreen" }}
{{- end }}
{{- range $volume := $pod.spec.volumes }}
{{- if eq $volume.name "frontend-config" }}
{{- $_ := set $volume.configMap "name" (include "erp.uiVersionedConfigName" $.Values.ui.config) }}
{{- end }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: metasfresh-ui-bluegreen
  namespace: {{ include "erp.namespace" . }}
  labels:
    {{- include "erp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  replicas: {{ .Values.ui.replicaCount }}
  revisionHistoryLimit: {{ .Values.ui.blueGreen.revisionHistoryLimit }}
  selector:
    matchLabels: {app: metasfresh-ui-bluegreen}
  strategy:
    blueGreen:
      activeService: metasfresh-ui-active
      previewService: metasfresh-ui-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: {{ .Values.ui.blueGreen.scaleDownDelaySeconds }}
  template:
    {{- toYaml $pod | nindent 4 }}
{{- end }}
