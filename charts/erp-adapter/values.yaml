validation:
  strict: false
global:
  namespace: erp
  registry: 10.60.50.30
  imagePullSecrets:
  - name: harbor-pull
runtime:
  propertiesSecret:
    name: erp-properties
    key: metasfresh.properties
    revision: ''
  rabbitmqSecret:
    name: erp-rabbit-secret
    usernameKey: username
    passwordKey: password
databaseTLS:
  enabled: false
  mode: verify-full
  secretName: erp-postgres-ca
  key: ca.crt
  mountPath: /etc/metasfresh/db-ca/ca.crt
serviceAccount:
  create: true
  name: erp-app
persistence:
  storageClass: ''
core:
  replicaCount: 1
  image:
    repository: 10.60.50.30/metasfresh/metas-app
    tag: ''
    digest: sha256:c4327743ef50077590878558b8dd94c86391c56d806c9525cde1fdb5be4d5cd3
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 1000m
      memory: 3Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  nodeSelector:
    cmc-cloud-k8s-nodegroups: nodegroup-gd6u
  tolerations: []
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
  javaOptions: -Xms512m -Xmx2048m
  extraEnv: []
  persistence:
    enabled: true
    existingClaim: ''
    size: 20Gi
    mountPath: /opt/metasfresh/data
  probes:
    startup:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 120
    readiness:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      tcpSocket:
        port: http
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
api:
  replicaCount: 1
  image:
    repository: 10.60.50.30/metasfresh/metas-api
    tag: ''
    digest: sha256:1364ad06166a8b8a830e9a84c10cf20ce404c3e3f5915a273f87469ac0d743c6
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 3Gi
  nodeSelector:
    cmc-cloud-k8s-nodegroups: nodegroup-gd6u
  tolerations: []
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
  javaOptions: -Xms256m -Xmx1536m
  extraEnv: []
  persistence:
    enabled: true
    existingClaim: ''
    size: 20Gi
    mountPath: /var/lib/metasfresh/api
  probes:
    startup:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 120
    readiness:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      tcpSocket:
        port: http
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
ui:
  replicaCount: 2
  image:
    repository: 10.60.50.30/metasfresh/metas-frontend
    tag: ''
    digest: sha256:c94094ff2d565bf8b40a72314ea76cca547ea29825a2ee815ada69c2707fb766
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    cmc-cloud-k8s-nodegroups: nodegroup-gd6u
  tolerations: []
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
  extraEnv: []
  config:
    apiUrl: /rest/api
    websocketUrl: /stomp
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
  disruptionBudget:
    enabled: true
    minAvailable: 1
  probes:
    startup:
      httpGet:
        path: /config.js
        port: http
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      httpGet:
        path: /
        port: http
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      httpGet:
        path: /
        port: http
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
externalDB:
  pgHost: ''
  pgPort: 5432
  pgCIDR: ''
  rabbitHost: ''
  rabbitPort: 5672
  rabbitCIDR: ''
  searchHost: ''
  searchPort: 9200
  searchCIDR: ''
  searchTransportPort: 0
ingress:
  enabled: true
  className: haproxy
  host: ''
  tlsSecretName: erp-origin-tls
  annotations: {}
networkPolicy:
  enabled: true
  ingressController:
    namespace: ingress-system
    podSelector: {}
  dns:
    namespace: kube-system
    podSelector:
      k8s-app: kube-dns
    additionalCIDRs: []
  backendAdditionalEgress: []
metrics:
  enabled: false
  path: /prometheus
  namespace: monitoring
  podSelector:
    app.kubernetes.io/name: prometheus
