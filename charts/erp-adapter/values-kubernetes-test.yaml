# Metasfresh ERP - Kubernetes TEST only
# Do not reuse production ERP database credentials.

validation:
  strict: false

global:
  namespace: erp
  registry: 10.60.50.30
  imagePullSecrets:
    - name: harbor-pull-vault

runtime:
  propertiesSecret:
    name: erp-properties-vault
    key: metasfresh.properties
  rabbitmqSecret:
    name: erp-rabbit-vault
    usernameKey: username
    passwordKey: password

# Temporary LAB setting. Requires security review before production.
databaseTLS:
  enabled: false

persistence:
  storageClass: highio

core:
  replicaCount: 1
  image:
    tag: ""
    digest: sha256:c4327743ef50077590878558b8dd94c86391c56d806c9525cde1fdb5be4d5cd3
  nodeSelector:
    cmc-cloud-k8s-nodegroups: null
    cmccloud-k8s-nodegroups: nodegroup-app
  javaOptions: "-Xms512m -Xmx2048m"
  extraEnv:
    - name: SPRING_RABBITMQ_VIRTUAL_HOST
      value: "/metasfresh-test"

api:
  replicaCount: 1
  image:
    tag: ""
    digest: sha256:1364ad06166a8b8a830e9a84c10cf20ce404c3e3f5915a273f87469ac0d743c6
  nodeSelector:
    cmc-cloud-k8s-nodegroups: null
    cmccloud-k8s-nodegroups: nodegroup-app
  javaOptions: "-Xms256m -Xmx1536m"
  extraEnv:
    - name: SPRING_RABBITMQ_VIRTUAL_HOST
      value: "/metasfresh-test"

ui:
  replicaCount: 1
  image:
    tag: ""
    digest: sha256:c94094ff2d565bf8b40a72314ea76cca547ea29825a2ee815ada69c2707fb766
  nodeSelector:
    cmc-cloud-k8s-nodegroups: null
    cmccloud-k8s-nodegroups: nodegroup-app
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
  disruptionBudget:
    enabled: false

externalDB:
  pgHost: 10.60.40.113
  pgPort: 5432
  pgCIDR: 10.60.40.113/32
  rabbitHost: 10.60.40.206
  rabbitPort: 5672
  rabbitCIDR: 10.60.40.206/32
  searchHost: 10.60.40.30
  searchPort: 9201
  searchCIDR: 10.60.40.30/32
  searchTransportPort: 0

ingress:
  enabled: true
  className: haproxy-test
  host: erp-test.lab.internal
  tlsSecretName: erp-origin-tls

networkPolicy:
  enabled: true
