apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-logging
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/clusters/kubernetes-test/observability/alloy/values.yaml

    - repoURL: https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git
      targetRevision: kubernetes-test
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy: {}
