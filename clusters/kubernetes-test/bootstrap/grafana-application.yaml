apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-monitoring
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 13.5.1

    helm:
      releaseName: grafana

      valuesObject:
        replicas: 1

        nodeSelector:
          cmccloud-k8s-nodegroups: nodegroup-monitoring

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password

        service:
          type: ClusterIP
          port: 80

        ingress:
          enabled: false

        persistence:
          enabled: true
          type: pvc
          storageClassName: highio
          accessModes:
            - ReadWriteOnce
          size: 2Gi

        testFramework:
          enabled: false

        serviceMonitor:
          enabled: false

        sidecar:
          dashboards:
            enabled: false
          datasources:
            enabled: false

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus-CMC
                uid: prometheus-cmc
                type: prometheus
                access: proxy
                url: http://prometheus-server.cmc-monitoring.svc.cluster.local:80
                isDefault: true
                editable: false
                jsonData:
                  timeInterval: 30s

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy: {}
              - name: Loki-CMC
                uid: loki-cmc
                type: loki
                access: proxy
                url: http://loki.logging.svc.cluster.local:3100
                isDefault: false
                editable: false
                jsonData:
                  maxLines: 1000
