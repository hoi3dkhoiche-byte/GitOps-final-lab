apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-internal-ingress
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git
    targetRevision: kubernetes-test
    path: clusters/kubernetes-test/ingress/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy: {}
