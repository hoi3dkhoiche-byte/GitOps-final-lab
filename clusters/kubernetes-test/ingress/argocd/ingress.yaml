apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-internal
  namespace: argocd
  annotations:
    haproxy.org/ssl-passthrough: "true"
spec:
  ingressClassName: haproxy-test

  tls:
    - hosts:
        - argocd.lab.internal

  rules:
    - host: argocd.lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
