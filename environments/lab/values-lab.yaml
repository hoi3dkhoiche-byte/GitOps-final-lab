# Generated by scripts/site_config.py; edit site.yaml then regenerate.
validation:
  strict: false        # <-- BẮT BUỘC đổi thành false (để Helm validation cho phép tắt databaseTLS)
global:
  namespace: erp
  registry: 10.60.50.30
  imagePullSecrets:
  - name: harbor-pull
runtime:
  propertiesSecret:
    name: erp-properties
    key: metasfresh.properties
    revision: ''
  rabbitmqSecret:
    name: erp-rabbit-secret
    usernameKey: username
    passwordKey: password
databaseTLS:
  enabled: false       # <-- Tắt TLS do RDS PostgreSQL chưa bật SSL
persistence:
  storageClass: highio
core:
  image:
    repository: 10.60.50.30/metasfresh/metas-app
    tag: "5.175"
  javaOptions: "-Xms512m -Xmx2048m"
  nodeSelector: &id001
    cmc-cloud-k8s-nodegroups: nodegroup-gd6u
  persistence:
    existingClaim: ''
api:
  image:
    repository: 10.60.50.30/metasfresh/metas-api
    tag: "5.175"
  javaOptions: "-Xms256m -Xmx1536m"
  nodeSelector: *id001
  persistence:
    existingClaim: ''
ui:
  image:
    repository: 10.60.50.30/metasfresh/metas-frontend
    tag: "5.175"
  nodeSelector: *id001
  config:
    apiUrl: /rest/api
    websocketUrl: /stomp
  autoscaling:
    enabled: false
externalDB:
  pgHost: 10.60.40.113
  pgPort: 5432
  pgCIDR: 10.60.40.113/32
  rabbitHost: 10.60.40.104
  rabbitPort: 5672
  rabbitCIDR: 10.60.40.104/32
  searchHost: 10.60.40.30
  searchPort: 9200
  searchCIDR: 10.60.40.30/32
  searchTransportPort: 0
ingress:
  enabled: true
  className: haproxy
  host: erp.local.vn
  tlsSecretName: erp-origin-tls
networkPolicy:
  enabled: true
  ingressController:
    namespace: ingress-system
    podSelector:
      app.kubernetes.io/name: kubernetes-ingress
      app.kubernetes.io/instance: haproxy
metrics:
  enabled: false
