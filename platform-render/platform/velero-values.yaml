image:
  tag: v1.18.1
nodeSelector:
  cmc-cloud-k8s-nodegroups: nodegroup-platform
tolerations:
- key: dedicated
  operator: Equal
  value: platform
  effect: NoSchedule
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
initContainers:
- name: velero-plugin-for-aws
  image: velero/velero-plugin-for-aws:v1.14.0
  imagePullPolicy: IfNotPresent
  volumeMounts:
  - name: plugins
    mountPath: /target
credentials:
  useSecret: true
  existingSecret: s3-velero
configuration:
  uploaderType: kopia
  defaultVolumesToFsBackup: false
  backupStorageLocation:
  - name: default
    provider: aws
    bucket: final-lab-velero-manh
    default: true
    accessMode: ReadWrite
    credential:
      name: s3-velero
      key: cloud
    config:
      region: hcm-1
      s3Url: https://s3.hcm-5.cloud.cmctelecom.vn
      s3ForcePathStyle: 'true'
      insecureSkipTLSVerify: 'false'
      checksumAlgorithm: ''
  volumeSnapshotLocation: []
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 1
        podResources:
          cpuRequest: 100m
          cpuLimit: 500m
          memoryRequest: 128Mi
          memoryLimit: 256Mi
backupsEnabled: true
snapshotsEnabled: false
deployNodeAgent: true
nodeAgent:
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
  - key: dedicated
    operator: Equal
    value: platform
    effect: NoSchedule
  - key: dedicated
    operator: Equal
    value: monitoring
    effect: NoSchedule
  extraArgs:
  - --node-agent-configmap=velero-node-agent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    runAsUser: 0
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
  nodeAgentPodMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
upgradeCRDs: true
cleanUpCRDs: false
schedules: {}
extraObjects:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: velero-node-agent
    namespace: velero
  data:
    node-agent-config.json: "{\n  \"loadConcurrency\": {\"globalConfig\": 1},\n  \"\
      podResources\": {\n    \"cpuRequest\": \"100m\",\n    \"cpuLimit\": \"500m\"\
      ,\n    \"memoryRequest\": \"128Mi\",\n    \"memoryLimit\": \"256Mi\",\n    \"\
      ephemeralStorageRequest\": \"1Gi\",\n    \"ephemeralStorageLimit\": \"2Gi\"\n\
      \  }\n}\n"
