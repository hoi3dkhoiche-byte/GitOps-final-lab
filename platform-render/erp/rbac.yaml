apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: erp-readonly
  namespace: erp
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - services
  - endpoints
  - configmaps
  - persistentvolumeclaims
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: erp-operator
  namespace: erp
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - services
  - endpoints
  - configmaps
  - persistentvolumeclaims
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments/scale
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: erp-readonly
  namespace: erp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: erp-readonly
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: erp-operator
  namespace: erp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: erp-operator
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: admin
