apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metasfresh-erp
  namespace: argocd
spec:
  project: erp
  source:
    repoURL: https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git
    targetRevision: main
    path: charts/erp-adapter
    helm:
      releaseName: erp
      valueFiles:
      - ../../environments/lab/values-lab.yaml
      - ../../environments/lab/values-runtime-trial.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: erp
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
