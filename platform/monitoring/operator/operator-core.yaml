    app: kube-prometheus-stack-operator
    app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
    app.kubernetes.io/component: prometheus-operator
spec:
  ports:
  - name: https
    port: 443
    targetPort: https
  selector:
    app: kube-prometheus-stack-operator
    release: monitoring
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-operator
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: 92.1.0
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-92.1.0
    release: monitoring
    heritage: Helm
    app: kube-prometheus-stack-operator
    app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
    app.kubernetes.io/component: prometheus-operator
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: kube-prometheus-stack-operator
      release: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: monitoring
        app.kubernetes.io/version: 92.1.0
        app.kubernetes.io/part-of: kube-prometheus-stack
        chart: kube-prometheus-stack-92.1.0
        release: monitoring
        heritage: Helm
        app: kube-prometheus-stack-operator
        app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
        app.kubernetes.io/component: prometheus-operator
    spec:
      containers:
      - name: kube-prometheus-stack
        image: quay.io/prometheus-operator/prometheus-operator:v0.94.1
        imagePullPolicy: IfNotPresent
        args:
        - --kubelet-service=kube-system/monitoring-kubelet
        - --kubelet-endpoints=true
        - --kubelet-endpointslice=false
        - --localhost=127.0.0.1
        - --prometheus-config-reloader=quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
        - --config-reloader-cpu-request=10m
        - --config-reloader-cpu-limit=100m
        - --config-reloader-memory-request=16Mi
        - --config-reloader-memory-limit=32Mi
        - --thanos-default-base-image=quay.io/thanos/thanos:v0.42.4
        - --secret-field-selector=type!=kubernetes.io/dockercfg,type!=helm.sh/release.v1
        - --web.enable-tls=true
        - --web.cert-file=/cert/cert
        - --web.key-file=/cert/key
        - --web.listen-address=:10250
        - --web.tls-min-version=VersionTLS13
        ports:
        - containerPort: 10250
          name: https
        env:
        - name: GOGC
          value: '30'
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tls-secret
          mountPath: /cert
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: tls-secret
        secret:
          defaultMode: 420
          secretName: monitoring-admission
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: monitoring-operator
      automountServiceAccountToken: true
      nodeSelector:
        cmc-cloud-k8s-nodegroups: nodegroup-monitoring
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: monitoring
