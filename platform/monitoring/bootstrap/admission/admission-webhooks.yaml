---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: monitoring-admission
  labels:
    app: kube-prometheus-stack-admission
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: 92.1.0
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-92.1.0
    release: monitoring
    heritage: Helm
    app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
    app.kubernetes.io/component: prometheus-operator-webhook
webhooks:
- name: prometheusrulemutate.monitoring.coreos.com
  failurePolicy: Ignore
  rules:
  - apiGroups:
    - monitoring.coreos.com
    apiVersions:
    - '*'
    resources:
    - prometheusrules
    operations:
    - CREATE
    - UPDATE
  clientConfig:
    service:
      namespace: monitoring
      name: monitoring-operator
      path: /admission-prometheusrules/mutate
  timeoutSeconds: 10
  admissionReviewVersions:
  - v1
  - v1beta1
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: monitoring-admission
  labels:
    app: kube-prometheus-stack-admission
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: 92.1.0
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-92.1.0
    release: monitoring
    heritage: Helm
    app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
    app.kubernetes.io/component: prometheus-operator-webhook
webhooks:
- name: prometheusrulevalidate.monitoring.coreos.com
  failurePolicy: Ignore
  rules:
  - apiGroups:
    - monitoring.coreos.com
    apiVersions:
    - '*'
    resources:
    - prometheusrules
    operations:
    - CREATE
    - UPDATE
  clientConfig:
    service:
      namespace: monitoring
      name: monitoring-operator
      path: /admission-prometheusrules/validate
  timeoutSeconds: 10
  admissionReviewVersions:
  - v1
  - v1beta1
  sideEffects: None
- name: alertmanagerconfigsvalidate.monitoring.coreos.com
  failurePolicy: Ignore
  rules:
  - apiGroups:
    - monitoring.coreos.com
    apiVersions:
    - v1alpha1
    resources:
    - alertmanagerconfigs
    operations:
    - CREATE
    - UPDATE
  clientConfig:
    service:
      namespace: monitoring
      name: monitoring-operator
      path: /admission-alertmanagerconfigs/validate
  timeoutSeconds: 10
  admissionReviewVersions:
  - v1
  - v1beta1
  sideEffects: None
