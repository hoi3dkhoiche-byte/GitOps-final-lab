---
apiVersion: batch/v1
kind: Job
metadata:
  name: monitoring-admission-patch
  namespace: monitoring
  labels:
    app: kube-prometheus-stack-admission-patch
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: 92.1.0
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-92.1.0
    release: monitoring
    heritage: Helm
    app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
    app.kubernetes.io/component: prometheus-operator-webhook
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      name: monitoring-admission-patch
      labels:
        app: kube-prometheus-stack-admission-patch
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: monitoring
        app.kubernetes.io/version: 92.1.0
        app.kubernetes.io/part-of: kube-prometheus-stack
        chart: kube-prometheus-stack-92.1.0
        release: monitoring
        heritage: Helm
        app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
        app.kubernetes.io/component: prometheus-operator-webhook
    spec:
      containers:
      - name: patch
        image: ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
        imagePullPolicy: IfNotPresent
        args:
        - patch
        - --webhook-name=monitoring-admission
        - --namespace=monitoring
        - --secret-name=monitoring-admission
        - --patch-failure-policy=
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
      restartPolicy: OnFailure
      serviceAccountName: monitoring-admission
      nodeSelector:
        cmc-cloud-k8s-nodegroups: nodegroup-monitoring
        kubernetes.io/os: linux
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: monitoring
      securityContext:
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
