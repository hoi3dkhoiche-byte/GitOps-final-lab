---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: true
metadata:
  labels:
    helm.sh/chart: grafana-13.3.0
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: 13.2.3
  name: monitoring-grafana
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    helm.sh/chart: grafana-13.3.0
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: 13.2.3
  name: monitoring-grafana-config-dashboards
  namespace: monitoring
data:
  provider.yaml: "apiVersion: 1\nproviders:\n  - name: 'sidecarProvider'\n    orgId:\
    \ 1\n    folder: ''\n    folderUid: ''\n    type: file\n    disableDeletion: false\n\
    \    allowUiUpdates: false\n    updateIntervalSeconds: 30\n    options:\n    \
    \  foldersFromFilesStructure: false\n      path: /tmp/dashboards"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-grafana
  namespace: monitoring
  labels:
    helm.sh/chart: grafana-13.3.0
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: 13.2.3
data:
  grafana.ini: '[analytics]

    check_for_updates = true

    [auth.anonymous]

    enabled = false

    [log]

    mode = console

    [paths]

    data = /var/lib/grafana/

    logs = /var/log/grafana

    plugins = /var/lib/grafana/plugins

    provisioning = /etc/grafana/provisioning

    [plugins]

    preinstall_auto_update = false

    [server]

    domain = ''''

    [unified_storage]

    index_path = /var/lib/grafana-search/bleve

    [users]

    allow_sign_up = false

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-grafana-datasource
  namespace: monitoring
  labels:
    grafana_datasource: '1'
    app: kube-prometheus-stack-grafana
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: 92.1.0
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-92.1.0
    release: monitoring
    heritage: Helm
data:
  datasource.yaml: "apiVersion: 1\ndatasources:\n- name: \"Prometheus\"\n  type: prometheus\n\
    \  uid: prometheus\n  url: http://monitoring-prometheus.monitoring:9090/\n  access:\
    \ proxy\n  isDefault: true\n  jsonData:\n    httpMethod: POST\n    timeInterval:\
    \ 30s\n- name: \"Alertmanager\"\n  type: alertmanager\n  uid: alertmanager\n \
    \ url: http://monitoring-alertmanager.monitoring:9093/\n  access: proxy\n  jsonData:\n\
    \    handleGrafanaManagedAlerts: false\n    implementation: prometheus\n- access:\
    \ proxy\n  editable: false\n  name: Loki\n  type: loki\n  uid: loki\n  url: http://loki-gateway.monitoring.svc.cluster.local"
---
