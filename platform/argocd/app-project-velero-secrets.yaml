apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: velero-secrets
  namespace: argocd

spec:
  description: Velero encrypted S3 credentials

  sourceRepos:
    - https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git

  destinations:
    - namespace: velero
      server: https://kubernetes.default.svc

  clusterResourceWhitelist: []

  namespaceResourceWhitelist:
    - group: bitnami.com
      kind: SealedSecret

  orphanedResources:
    warn: true
