apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-operator
  namespace: argocd

spec:
  project: observability-operator

  source:
    repoURL: https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git
    targetRevision: main
    path: platform/monitoring/operator

    directory:
      recurse: false
      include: operator-core.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy: {}
