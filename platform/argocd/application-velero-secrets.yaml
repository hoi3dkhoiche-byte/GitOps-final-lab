apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: velero-secrets
  namespace: argocd

spec:
  project: velero-secrets

  source:
    repoURL: https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git
    targetRevision: main
    path: platform/velero/secrets
    directory:
      recurse: false
      include: "*.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: velero

  syncPolicy: {}
