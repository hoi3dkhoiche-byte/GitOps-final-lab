apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: alloy
  namespace: argocd

spec:
  project: observability-alloy

  source:
    repoURL: https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git
    targetRevision: main
    path: platform-render/platform
    directory:
      recurse: false
      include: alloy.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy: {}
