apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: grafana
  namespace: argocd

spec:
  project: observability-grafana

  source:
    repoURL: https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git
    targetRevision: main
    path: platform/monitoring/grafana

    directory:
      recurse: false
      include: grafana.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy: {}
