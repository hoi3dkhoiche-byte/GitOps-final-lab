apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: observability-metrics-agents
  namespace: argocd

spec:
  description: GitOps for kube-state-metrics and Prometheus node-exporter

  sourceRepos:
    - https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git

  destinations:
    - namespace: monitoring
      server: https://kubernetes.default.svc

  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: apps
      kind: DaemonSet

  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  orphanedResources:
    warn: false
