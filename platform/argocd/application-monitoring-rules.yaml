apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-rules
  namespace: argocd

spec:
  project: observability-monitoring-rules

  source:
    repoURL: https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git
    targetRevision: main
    path: platform-render/gitops

    directory:
      recurse: false
      include: monitoring-rules.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy: {}
