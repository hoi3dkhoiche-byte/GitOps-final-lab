apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: velero-runtime
  namespace: argocd

spec:
  description: GitOps ownership for Velero Controller and Node Agent

  sourceRepos:
    - https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git

  destinations:
    - namespace: velero
      server: https://kubernetes.default.svc

  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: apps
      kind: DaemonSet
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: velero.io
      kind: BackupStorageLocation

  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  orphanedResources:
    warn: false
