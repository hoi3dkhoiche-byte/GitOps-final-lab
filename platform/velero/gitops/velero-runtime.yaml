---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-server
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: velero-12.1.0
automountServiceAccountToken: true
---
apiVersion: v1
data:
  node-agent-config.json: "{\n  \"loadConcurrency\": {\"globalConfig\": 1},\n  \"\
    podResources\": {\n    \"cpuRequest\": \"100m\",\n    \"cpuLimit\": \"500m\",\n\
    \    \"memoryRequest\": \"128Mi\",\n    \"memoryLimit\": \"256Mi\",\n    \"ephemeralStorageRequest\"\
    : \"1Gi\",\n    \"ephemeralStorageLimit\": \"2Gi\"\n  }\n}\n"
kind: ConfigMap
metadata:
  name: velero-node-agent
  namespace: velero
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-repo-maintenance
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: velero-12.1.0
data:
  global: "{\n  \"keepLatestMaintenanceJobs\": 1,\n  \"podResources\": {\n    \"cpuLimit\"\
    : \"500m\",\n    \"cpuRequest\": \"100m\",\n    \"memoryLimit\": \"256Mi\",\n\
    \    \"memoryRequest\": \"128Mi\"\n  }\n}\n"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero-server
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: velero-12.1.0
subjects:
- kind: ServiceAccount
  namespace: velero
  name: velero-server
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-server
  namespace: velero
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: velero-12.1.0
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velero-server
  namespace: velero
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: velero-12.1.0
subjects:
- kind: ServiceAccount
  namespace: velero
  name: velero-server
roleRef:
  kind: Role
  name: velero-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: velero
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.18.1
    helm.sh/chart: velero-12.1.0
spec:
  type: ClusterIP
  ports:
  - name: http-monitoring
    port: 8085
    targetPort: http-monitoring
  selector:
    name: velero
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.18.1
    helm.sh/chart: velero-12.1.0
spec:
  selector:
    matchLabels:
      name: node-agent
  template:
    metadata:
      labels:
        name: node-agent
        role: node-agent
        app.kubernetes.io/name: velero
        app.kubernetes.io/instance: velero
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: 1.18.1
        helm.sh/chart: velero-12.1.0
      annotations: null
    spec:
      serviceAccountName: velero-server
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0
      terminationGracePeriodSeconds: 3600
      volumes:
      - name: cloud-credentials
        secret:
          secretName: s3-velero
      - name: host-pods
        hostPath:
          path: /var/lib/kubelet/pods
      - name: host-plugins
        hostPath:
          path: /var/lib/kubelet/plugins
      - name: scratch
        emptyDir: {}
      dnsPolicy: ClusterFirst
      containers:
      - name: node-agent
        image: docker.io/velero/velero:v1.18.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-monitoring
          containerPort: 8085
        command:
        - /velero
        args:
        - node-agent
        - server
        - --node-agent-configmap=velero-node-agent
        volumeMounts:
        - name: cloud-credentials
          mountPath: /credentials
        - name: host-pods
          mountPath: /host_pods
          mountPropagation: HostToContainer
        - name: host-plugins
          mountPath: /host_plugins
          mountPropagation: HostToContainer
        - name: scratch
          mountPath: /scratch
        env:
        - name: VELERO_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: VELERO_SCRATCH_DIR
          value: /scratch
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /credentials/cloud
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /credentials/cloud
        - name: AZURE_CREDENTIALS_FILE
          value: /credentials/cloud
        - name: ALIBABA_CLOUD_CREDENTIALS_FILE
          value: /credentials/cloud
        securityContext: null
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: platform
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: monitoring
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.18.1
    helm.sh/chart: velero-12.1.0
    component: velero
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: velero
      app.kubernetes.io/name: velero
  template:
    metadata:
      labels:
        name: velero
        app.kubernetes.io/name: velero
        app.kubernetes.io/instance: velero
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: 1.18.1
        helm.sh/chart: velero-12.1.0
      annotations: null
    spec:
      restartPolicy: Always
      serviceAccountName: velero-server
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 3600
      containers:
      - name: velero
        image: docker.io/velero/velero:v1.18.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-monitoring
          containerPort: 8085
        command:
        - /velero
        args:
        - server
        - --uploader-type=kopia
        - --repo-maintenance-job-configmap=velero-repo-maintenance
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /metrics
            port: http-monitoring
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /metrics
            port: http-monitoring
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        volumeMounts:
        - name: plugins
          mountPath: /plugins
        - name: cloud-credentials
          mountPath: /credentials
        - name: scratch
          mountPath: /scratch
        env:
        - name: VELERO_SCRATCH_DIR
          value: /scratch
        - name: VELERO_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: LD_LIBRARY_PATH
          value: /plugins
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /credentials/cloud
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /credentials/cloud
        - name: AZURE_CREDENTIALS_FILE
          value: /credentials/cloud
        - name: ALIBABA_CLOUD_CREDENTIALS_FILE
          value: /credentials/cloud
      dnsPolicy: ClusterFirst
      initContainers:
      - image: velero/velero-plugin-for-aws:v1.14.0
        imagePullPolicy: IfNotPresent
        name: velero-plugin-for-aws
        volumeMounts:
        - mountPath: /target
          name: plugins
      volumes:
      - name: cloud-credentials
        secret:
          secretName: s3-velero
      - name: plugins
        emptyDir: {}
      - name: scratch
        emptyDir: {}
      nodeSelector:
        cmc-cloud-k8s-nodegroups: nodegroup-platform
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: platform
---
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.18.1
    helm.sh/chart: velero-12.1.0
spec:
  credential:
    name: s3-velero
    key: cloud
  provider: aws
  accessMode: ReadWrite
  default: true
  objectStorage:
    bucket: final-lab-velero-manh
  config:
    checksumAlgorithm: ''
    insecureSkipTLSVerify: 'false'
    region: hcm-1
    s3ForcePathStyle: 'true'
    s3Url: https://s3.hcm-5.cloud.cmctelecom.vn
